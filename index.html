<h3>Datos que NO recolectamos</h3><p>Tu ubicación exacta (solo si activas «Personas cerca» guardamos una ubicación aproximada de unos 1 km; nunca se muestra a otros, solo una distancia aproximada, y puedes borrarla cuando quieras en Perfil), contactos del teléfono ni documentos de identidad. No usamos reconocimiento facial automático ni guardamos plantillas biométricas: la selfie de verificación la compara una persona con tus fotos de perfil y luego se borra. El país de tu perfil es un dato que tú declaras y puedes cambiar cuando quieras.</p>
<h3>Para qué los usamos</h3><p>Para operar el servicio, mostrar perfiles, crear matches, permitir chats, calcular una compatibilidad estimada con una fórmula simple (sin inteligencia artificial externa) y mantener la seguridad y la moderación.</p>
<h3>Quién ve qué</h3><p>Otros usuarios registrados ven tu nombre, edad (si no la ocultas), país, biografía, intereses, objetivo, fotos, respuestas a preguntas, presentación en voz, historias (24 horas), publicaciones del muro y, si activaste tu ubicación, la distancia aproximada que hay entre ustedes (nunca tus coordenadas). Tu correo nunca se muestra. Tus mensajes y notas de voz solo los ve la otra persona del chat. Tu selfie de verificación solo la ve quien modera TrueMatch. Los mensajes no están cifrados de extremo a extremo: el administrador del servicio puede acceder técnicamente a los datos para moderación y soporte. No vendemos tus datos ni los compartimos con anunciantes.</p>
<h3>Proveedores</h3><p>Usamos Supabase (base de datos, autenticación y almacenamiento de fotos) y GitHub Pages (alojamiento de la página). Si usas la traducción de mensajes (opcional), el texto del mensaje que decides traducir se envía a MyMemory (translated.net), un servicio externo de traducción automática, sin tu correo ni tu nombre; su tratamiento se rige por su propia política. Tus datos pueden procesarse en servidores fuera de tu país.</p>
<h3>Cuánto tiempo los conservamos</h3><p>Mientras tu cuenta exista. Si la borras desde Perfil, se eliminan tu cuenta de acceso, perfil, foto, Me gusta, matches, mensajes y registros asociados. Las copias de seguridad del proveedor, si existen, se sobrescriben con el tiempo.</p>
<h3>Tus derechos</h3><p>Puedes pedir acceso, corrección, eliminación, oposición o una copia de tus datos escribiendo a ${CONTACTO}; responderemos en un plazo razonable (objetivo: 30 días). La eliminación también puedes hacerla tú mismo en Perfil. Esto está pensado para respetar el artículo 28 de la Constitución de Venezuela (acceso, rectificación y supresión de datos) y normas como el RGPD europeo, la ley de California, la LGPD de Brasil y otras leyes de tu país.</p>
<h3>Menores</h3><p>TrueMatch es solo para mayores de 18 años y no recolecta datos de menores a sabiendas.</p>
<h3>Seguridad</h3><p>Usamos conexión cifrada (HTTPS) y reglas de acceso que limitan qué datos puede leer cada persona. Ningún sistema es 100% seguro. Si ocurriera una brecha que te afecte, te avisaremos como lo exija la ley.</p>
<h3>Cookies y almacenamiento local</h3><p>Usamos el almacenamiento del navegador solo para mantener tu sesión y recordar los perfiles que pasaste. No usamos cookies de publicidad ni rastreadores de terceros.</p>`,
n:`<h2>Normas de la comunidad</h2>${NOTA}
<p>TrueMatch es para conocer personas reales con respeto. Está prohibido:</p>
<p>• Ser menor de 18 años o interactuar de forma sexual con menores.<br>• Perfiles falsos, suplantación de identidad o fotos de otras personas.<br>• Acoso, amenazas, discurso de odio o discriminación.<br>• Desnudos, contenido sexual explícito o violento.<br>• Estafas, pedir dinero, vender cosas, publicidad o spam.<br>• Compartir datos privados de otras personas.<br>• Cualquier actividad ilegal.</p>
<h3>Qué hacemos si se incumplen</h3><p>Podemos retirar contenido, suspender o eliminar cuentas y, cuando la ley lo exija, avisar a las autoridades.</p>
<h3>Cómo protegerte</h3><p>Usa <b>Reportar</b> y <b>Bloquear</b> en cualquier perfil o chat. No envíes dinero ni datos bancarios. Reúnete en lugares públicos y avisa a alguien de confianza.</p>`,
i:`<h2>Seguridad infantil</h2>${NOTA}
<p>TrueMatch tiene tolerancia cero con el abuso y la explotación sexual infantil. Solo se permite el uso a personas de 18 años o más.</p>
<p>• Puedes reportar cualquier perfil o mensaje desde la app con el botón Reportar.<br>• Si recibimos un reporte de este tipo, retiramos el contenido, cerramos la cuenta y, cuando corresponda, lo informamos a las autoridades competentes.<br>• Persona de contacto para temas de seguridad infantil: ${CONTACTO}.</p>

 toast(n.kind==="verif_ok"?"✅ "+t("v_ok"):"❌ "+t("v_rej"),()=>{tab="p";chatM=null;draw()});
 if(!chatM&&(tab==="d"||tab==="w"||tab==="p"))draw()}
function closeTy(){try{if(TY)sb.removeChannel(TY)}catch(e){}TY=null;TYR=false;clearTimeout(TYT)}
function openTy(){closeTy();if(!chatM)return;const mid=chatM;
 try{TY=sb.channel("ty:"+mid,{config:{broadcast:{self:false}}}).on("broadcast",{event:"typing"},pl=>{if(!pl||!pl.payload||pl.payload.u===U.id||mid!==chatM)return;const e=$("typ");if(e)e.textContent=t("typing");clearTimeout(TYT);TYT=setTimeout(()=>{const x=$("typ");if(x)x.textContent=""},3500)}).subscribe(st=>{TYR=st==="SUBSCRIBED"})}catch(e){}}
function typSend(){const n=Date.now();if(!TY||!TYR||n-TYL<2000)return;TYL=n;try{TY.send({type:"broadcast",event:"typing",payload:{u:U.id}})}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.hidden||!U||!ME)return;loadNotifs();if(tab==="c"&&chatM)refreshMsgs()});
const TL_LIST="es en pt fr de it ru zh-CN ja ko ar hi tr nl pl uk sv ro el he id vi th cs hu fi da ca fa ms bn sw".split(" ");
let TL=(()=>{try{return localStorage.getItem("tm_tl")||LANG}catch(e){return LANG}})(),TAUTO=(()=>{try{return localStorage.getItem("tm_tauto")==="1"}catch(e){return false}})();
let TRC={},TRS=new Set(),TRH=new Set(),TRB=new Set(),TRE={},MSGB={},TRQ=Promise.resolve();
const trName=c=>{try{return new Intl.DisplayNames([LANG],{type:"language"}).of(c)||c}catch(e){return c}};
const tlOpts=()=>{const l=TL_LIST.includes(TL)?TL_LIST:[TL,...TL_LIST];return [...l].sort((a,b)=>trName(a).localeCompare(trName(b),LANG)).map(c=>`<option value="${c}" ${c===TL?"selected":""}>${esc(trName(c))}</option>`).join("")};
const trCard=()=>`<div class="card" style="padding:10px 12px"><div class="row" style="align-items:center"><label style="margin:0;flex:none;font-size:14px">🌐 ${t("tr_to")}</label><select id="tls" onchange="setTL(this.value)" style="margin:0;padding:8px">${tlOpts()}</select></div><label style="display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;color:var(--tx)"><input type="checkbox" style="width:auto;margin:0" ${TAUTO?"checked":""} onchange="setAuto(this.checked)">${t("tr_auto")}</label><p class="mu" style="font-size:11px;margin:6px 0 0">${t("tr_note")}</p></div>`;
function trLoad(){try{TRC=JSON.parse(localStorage.getItem("tm_trc_"+U.id)||"{}")||{}}catch(e){TRC={}}}
function trSave(){try{const k=Object.keys(TRC);if(k.length>300)k.slice(0,k.length-300).forEach(x=>delete TRC[x]);localStorage.setItem("tm_trc_"+U.id,JSON.stringify(TRC))}catch(e){}}
const trBytes=x=>new TextEncoder().encode(x).length;
function trChunks(tx){const parts=tx.match(/[^.!?\n]+[.!?\n]*\s*/g)||[tx],out=[];let cur="";
 for(let p of parts){while(trBytes(p)>450){let n=p.length;while(n>1&&trBytes(p.slice(0,n))>450)n=Math.floor(n*0.8);if(cur){out.push(cur);cur=""}out.push(p.slice(0,n));p=p.slice(n)}
  if(trBytes(cur+p)>450){if(cur)out.push(cur);cur=p}else cur+=p}
 if(cur.trim())out.push(cur);return out}
const trDec=x=>{const e=document.createElement("textarea");e.innerHTML=x;return e.value};
async function trOne(q,tl){const r=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(q)+"&langpair=Autodetect%7C"+encodeURIComponent(tl));if(!r.ok)throw new Error("fail");
 const j=await r.json(),tx=(j.responseData&&j.responseData.translatedText)||"",st=String(j.responseStatus);
 if(/DISTINCT LANGUAGES/i.test(tx))return null;
 if(/MYMEMORY WARNING/i.test(tx)||st==="429")throw new Error("quota");
 if(st!=="200"||!tx)throw new Error("fail");return tx}
function trInner(id){const c=TRC[id+"|"+TL];
 if(TRB.has(id))return `<span class="trl">🌐 …</span>`;
 if(c&&c.same)return `<span class="trl">🌐 ${t("tr_same")}</span>`;
 if(c&&c.t&&TRS.has(id))return `<div class="trt">${esc(c.t)}</div><button class="trb" onclick="trHide(${id})">${t("tr_orig")}</button>`;
 if(TRE[id])return `<button class="trb" onclick="trMsg(${id})">🌐 ${t(TRE[id]==="quota"?"tr_quota":"tr_fail")}</button>`;
 return `<button class="trb" onclick="trMsg(${id})">🌐 ${t("tr_btn")}</button>`}
function trBox(x,mine){if(mine||!x.body||stk(x.body)||vnp(x.body))return "";MSGB[x.id]=x.body;return `<div class="trx" id="tr${x.id}">${trInner(x.id)}</div>`}
function trUpd(id){const e=$("tr"+id);if(e)e.innerHTML=trInner(id)}
function trHide(id){TRS.delete(id);TRH.add(id);delete TRE[id];const e=$("tr"+id);if(e)e.innerHTML=`<button class="trb" onclick="trMsg(${id})">🌐 ${t("tr_btn")}</button>`}
function trMsg(id){if(TRB.has(id))return;const k=id+"|"+TL;TRH.delete(id);delete TRE[id];
 if(TRC[k]){if(TRC[k].t)TRS.add(id);trUpd(id);return}
 const body=MSGB[id];if(!body)return;TRB.add(id);trUpd(id);
 TRQ=TRQ.then(async()=>{try{const outs=[];let same=false;for(const c of trChunks(body)){const r=await trOne(c,TL);if(r===null){same=true;break}outs.push(trDec(r))}
   TRC[k]=same?{same:1}:{t:outs.join(" ")};if(!same)TRS.add(id);trSave()}catch(e){TRE[id]=e.message==="quota"?"quota":"fail"}
  TRB.delete(id);trUpd(id)})}
function trAuto(rows){if(!TAUTO)return;(rows||[]).forEach(x=>{if(x.sender!==U.id&&x.body&&!stk(x.body)&&!vnp(x.body)&&!TRH.has(x.id)&&!TRE[x.id]&&!TRS.has(x.id)&&!TRB.has(x.id)&&!(TRC[x.id+"|"+TL]&&TRC[x.id+"|"+TL].same))trMsg(x.id)})}
function trRefresh(){TRS.clear();TRH.clear();TRE={};const el=$("ms");if(el)delete el.dataset.s;refreshMsgs()}
function setTL(v){TL=v;try{localStorage.setItem("tm_tl",v)}catch(e){}trRefresh()}
function setAuto(v){TAUTO=!!v;try{localStorage.setItem("tm_tauto",v?"1":"0")}catch(e){}trRefresh()}
document.documentElement.lang=LANG;
</script></body></html>
