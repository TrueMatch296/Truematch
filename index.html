<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TrueMatch</title>
<style>
:root{--bg:#fbf5ea;--card:#fff;--tx:#2b2220;--mu:#8a7b74;--co:#ff6b6b;--co2:#ff8e72;--ln:#eadfce;--gold:#e5a50a}
@media (prefers-color-scheme:dark){:root{--bg:#1d1715;--card:#2a211e;--tx:#f6ece4;--mu:#b3a299;--ln:#3b2f2a}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:Georgia,serif;display:flex;justify-content:center}
#app{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
main{flex:1;overflow-y:auto;padding:16px}
h1,h2,h3{margin:0 0 8px;font-weight:600}h1{font-size:28px}
.s,button,input,textarea,select,nav{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
.logo{color:var(--co);font-style:italic}.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 6px 20px rgba(120,70,50,.08);animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.av{height:190px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:80px;margin-bottom:12px;background:linear-gradient(135deg,#ffd6d6,#ffe3c2);color:var(--co);position:relative;overflow:hidden}
.tag{display:inline-block;padding:4px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--ln);font-size:13px;margin:2px 4px 2px 0}.tag.on{background:var(--co);color:#fff;border-color:var(--co)}
.badge{font-size:12px;padding:3px 8px;border-radius:8px;background:var(--bg);color:var(--mu)}.badge.v{background:#d4f0dd;color:#14602a}
.bar{height:8px;border-radius:9px;background:var(--ln);overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--co),var(--co2))}
button{border-radius:14px;padding:12px 16px;font-size:16px;cursor:pointer;background:var(--card);color:var(--tx);border:1px solid var(--ln)}
button.p{background:linear-gradient(135deg,var(--co),var(--co2));color:#fff;border:0}
.row{display:flex;gap:10px}.row>*{flex:1}.act{justify-content:center}.act button{font-size:26px;border-radius:50%;height:62px;width:62px;flex:none;padding:0}
input,textarea,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:16px;margin:4px 0 10px}
label{font-size:14px;color:var(--mu)}
nav{display:flex;border-top:1px solid var(--ln);background:var(--card);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;font-size:10px;color:var(--mu);padding:6px 0}nav button b{display:block;font-size:18px;font-weight:400}nav button.on{color:var(--co)}
.msg{max-width:78%;padding:9px 12px;border-radius:16px;margin:4px 0;font-size:15px}.me{background:var(--co);color:#fff;margin-left:auto}.ot{background:var(--card);border:1px solid var(--ln)}
.msg small{display:block;font-size:10px;opacity:.7;margin-top:2px}
.li{display:flex;gap:12px;align-items:center;cursor:pointer}.mini{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;background:#ffe3c2;color:var(--co);flex:none;overflow:hidden}
.note{font-size:13px;color:var(--mu);border:1px dashed var(--ln);padding:10px;border-radius:12px;margin:8px 0}
.av img,.mini img{width:100%;height:100%;object-fit:cover}

/* Marcos cosméticos */
.frame-gold{box-shadow:inset 0 0 0 6px #ffd700, 0 0 14px rgba(255,215,0,0.7)}
.frame-neon{box-shadow:inset 0 0 0 6px #00f0ff, 0 0 14px rgba(0,240,255,0.7)}
.frame-fire{box-shadow:inset 0 0 0 6px #ff3b00, 0 0 14px rgba(255,59,0,0.8)}
.dia-badge{display:inline-flex;align-items:center;gap:4px;background:#eef7ff;color:#0070f3;padding:4px 10px;border-radius:12px;font-weight:700;font-size:13px}
.item-card{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--ln);padding:10px 0}
.item-card:last-child{border-bottom:0}
</style>
</head>
<body>
<div id="app">
  <main id="m"><p class="mu s">Cargando…</p></main>
  <nav id="nv" style="display:none"></nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SB_URL="https://wuolzromjabdswklfnky.supabase.co",SB_KEY="sb_publishable_ufXIZPYH9h46I6bRgVk_gw_DucREjlY";
const CONTACTO="holayt2025@gmail.com";

const COUNTRIES = [
  {c:"GLOBAL",n:"Todos los países 🌍"},{c:"ES",n:"España 🇪🇸"},{c:"MX",n:"México 🇲🇽"},{c:"AR",n:"Argentina 🇦🇷"},
  {c:"CO",n:"Colombia 🇨🇴"},{c:"CL",n:"Chile 🇨🇱"},{c:"VE",n:"Venezuela 🇻🇪"},{c:"PE",n:"Perú 🇵🇪"},
  {c:"US",n:"Estados Unidos 🇺🇸"},{c:"FR",n:"Francia 🇫🇷"},{c:"IT",n:"Italia 🇮🇹"},{c:"DE",n:"Alemania 🇩🇪"},
  {c:"BR",n:"Brasil 🇧🇷"},{c:"GB",n:"Reino Unido 🇬🇧"},{c:"JP",n:"Japón 🇯🇵"}
];

const I18N = {
  es: {disc:"Descubrir", likes:"Me gusta", matches:"Matches", chat:"Chat", shop:"Tienda", prof:"Perfil", filter:"Filtrar por país:", diamonds:"Diamantes"},
  en: {disc:"Discover", likes:"Likes", matches:"Matches", chat:"Chat", shop:"Shop", prof:"Profile", filter:"Filter by country:", diamonds:"Diamonds"},
  pt: {disc:"Descobrir", likes:"Curtidas", matches:"Matches", chat:"Chat", shop:"Loja", prof:"Perfil", filter:"Filtrar por país:", diamonds:"Diamantes"},
  fr: {disc:"Découvrir", likes:"J'aime", matches:"Matchs", chat:"Chat", shop:"Boutique", prof:"Profil", filter:"Filtrer par pays:", diamonds:"Diamants"}
};
let lang = localStorage.getItem("tm_lang") || "es";
const t = k => (I18N[lang] && I18N[lang][k]) || I18N.es[k] || k;

const SHOP_ITEMS = [
  {id:"frame_gold", name:"Marco Dorado 👑", cost:20, type:"frame", cls:"frame-gold"},
  {id:"frame_neon", name:"Marco Neón ⚡", cost:35, type:"frame", cls:"frame-neon"},
  {id:"frame_fire", name:"Marco Fuego 🔥", cost:50, type:"frame", cls:"frame-fire"},
  {id:"pack_love", name:"Pack Emojis Amor 💖 (💐, 💌, 💍)", cost:15, type:"pack", emojis:["💐","💌","💍","🥰"]},
  {id:"pack_party", name:"Pack Fiesta 🎉 (🥂, 🚀, 💎)", cost:15, type:"pack", emojis:["🥂","🚀","💎","✨"]}
];

const INT=["Viajar","Música","Cine","Cocinar","Senderismo","Lectura","Deporte","Arte","Mascotas","Videojuegos","Baile","Fotografía"];
const GOALS=["Relación seria","Algo casual","Amistad primero","Aún no lo sé"];
window.onerror=(m)=>{$("m").innerHTML='<div class="note s">Error: '+m+'</div>'};
const sb=supabase.createClient(SB_URL,SB_KEY);
let U=null,ME=null,tab="d",chatM=null,poll=null,pend=[],filterCountry="GLOBAL";
const $=i=>document.getElementById(i);
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const age=d=>{const b=new Date(d),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return a};
const passes=()=>{try{return JSON.parse(localStorage.getItem("tm_pass_"+U.id)||"[]")}catch(e){return[]}};
const addPass=id=>{try{localStorage.setItem("tm_pass_"+U.id,JSON.stringify([...passes(),id]))}catch(e){}};
const tags=(a,b)=>(a||[]).map(x=>`<span class="tag ${b&&b.includes(x)?"on":""}">${esc(x)}</span>`).join("");
const C={};
async function urls(ps){const need=[...new Set(ps.filter(p=>p&&p.photo_path&&!C[p.photo_path]).map(p=>p.photo_path))];
 if(need.length){const{data}=await sb.storage.from("avatars").createSignedUrls(need,3600);(data||[]).forEach(d=>{if(d.signedUrl)C[d.path]=d.signedUrl})}}
const pic=p=>{const u=p.photo_path&&C[p.photo_path];return u?`<img src="${u}" alt="">`:esc(p.name?.[0]||"?")};
const err=e=>alert("Error: "+(e&&e.message?e.message:e));

function getFrameCls(item_id){
  const found = SHOP_ITEMS.find(x=>x.id===item_id);
  return found ? found.cls : "";
}

function score(p){const A=ME.interests||[],B=p.interests||[],sh=A.filter(x=>B.includes(x)).length,un=new Set([...A,...B]).size||1;
 return Math.round(sh/un*70+(ME.goal===p.goal?30:(ME.goal==="Aún no lo sé"||p.goal==="Aún no lo sé")?12:0))}
const ageTxt=p=>p.hide_age?"":", "+age(p.birth_date);
function head(){return `<h1><span class="logo">TrueMatch</span></h1><p class="mu">Conexiones reales sin fronteras.</p>`}

/* Legal Views */
const LEGAL={
t:`<h2>Términos de uso</h2><p>TrueMatch es para mayores de 18 años. Contacto: ${CONTACTO}</p>`,
p:`<h2>Política de privacidad</h2><p>Tus datos están protegidos. Contacto: ${CONTACTO}</p>`,
n:`<h2>Normas de la comunidad</h2><p>Respeto y tolerancia cero al acoso. Contacto: ${CONTACTO}</p>`,
i:`<h2>Seguridad infantil</h2><p>Tolerancia cero absoluta. Contacto: ${CONTACTO}</p>`};
function lg(k){let o=$("lg");if(!o){o=document.createElement("div");o.id="lg";o.style.cssText="position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:9;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 40px;max-width:440px;margin:0 auto";document.body.appendChild(o)}
 o.style.display="block";o.innerHTML=`<button class="s" onclick="$('lg').style.display='none'">← Cerrar</button><div class="s" style="line-height:1.5;font-size:15px;margin-top:10px">${LEGAL[k]}</div>`;return false}
const LK='<a href="#" onclick="return lg(\'t\')">Términos</a>, <a href="#" onclick="return lg(\'p\')">Privacidad</a>';

/* Autenticación */
function authView(){$("nv").style.display="none";$("m").innerHTML=head()+`<div class="card s"><h3>Entrar o crear cuenta</h3>
<label>Correo</label><input id="em" type="email" autocomplete="email"><label>Contraseña</label><input id="pw" type="password" autocomplete="current-password">
<label style="display:block;margin-bottom:10px"><input type="checkbox" id="ok1" style="width:auto;margin-right:8px">Tengo 18 años o más y acepto los ${LK}.</label><div class="row"><button class="p" onclick="login()">Entrar</button><button onclick="signup()">Crear cuenta</button></div></div>`}
async function login(){const{error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});if(error)err(error)}
async function signup(){const pw=$("pw").value;if(!$("ok1").checked)return alert("Acepta las condiciones.");if(pw.length<8)return alert("Mínimo 8 caracteres.");
 const{data,error}=await sb.auth.signUp({email:$("em").value.trim(),password:pw});if(error)return err(error);if(!data.session)alert("Verifica tu correo.")}

sb.auth.onAuthStateChange((ev,s)=>{U=s?s.user:null;setTimeout(()=>onAuth(),0)});
async function onAuth(){clearInterval(poll);if(!U){ME=null;authView();return}
 const{data}=await sb.from("profiles").select("*").eq("id",U.id).maybeSingle();ME=data;
 if(ME){ME.diamonds=ME.diamonds??10;ME.unlocked_items=ME.unlocked_items??[];ME.active_frame=ME.active_frame??"none";ME.country=ME.country??"ES";draw()}else setupView()}

function setupView(){$("nv").style.display="none";$("m").innerHTML=head()+`<div class="card s"><h3>Crea tu perfil</h3><label>Nombre</label><input id="n" maxlength="40">
<label>País</label><select id="co_sel">${COUNTRIES.filter(c=>c.c!=="GLOBAL").map(c=>`<option value="${c.c}">${c.n}</option>`).join("")}</select>
<label>Fecha de nacimiento</label><input id="dob" type="date"><label>Biografía</label><textarea id="bio" rows="3"></textarea>
<label>Objetivo</label><select id="g">${GOALS.map(g=>`<option>${g}</option>`).join("")}</select><label>Intereses</label><div id="ints">${INT.map(x=>`<span class="tag" onclick="this.classList.toggle('on')">${x}</span>`).join("")}</div>
<label><input type="checkbox" id="ok" style="width:auto;margin-right:8px">Confirmo 18 años y acepto las condiciones.</label>
<button class="p" style="width:100%;margin-top:10px" onclick="mk()">Guardar perfil</button></div>`}

async function mk(){const n=$("n").value.trim(),d=$("dob").value;if(!n\vert{}\vert{}!d\vert{}\vert{}age(d)<18\vert{}\vert{}!$("ok").checked)return alert("Verifica datos y edad (18+).");
 const i=[...document.querySelectorAll("#ints .on")].map(e=>e.textContent);
 const co=$("co_sel").value;
 const{data,error}=await sb.from("profiles").insert({id:U.id,name:n,birth_date:d,bio:$("bio").value,interests:i,goal:$("g").value,country:co,diamonds:10,unlocked_items:[],active_frame:"none"}).select().single();
 if(error)return err(error);ME=data;draw()}

/* Navegación */
const T=()=>[["d","♡",t("disc")],["l","♥",t("likes")],["m","✦",t("matches")],["s","💎",t("shop")],["c","💬",t("chat")],["p","☺",t("prof")]];

async function draw(){clearInterval(poll);$("nv").style.display="flex";
 $("nv").innerHTML=T().map(x=>`<button class="${tab===x[0]?"on":""}" onclick="tab='${x[0]}';chatM=null;draw()"><b>${x[1]}</b>${x[2]}</button>`).join("");
 $("m").innerHTML=`<p class="mu s">Cargando…</p>`;
 try{$("m").innerHTML=await({d:disc,l:likes,m:matches,s:shop,c:chat,p:prof}[tab])();$("m").scrollTop=0;if(tab==="c"&&chatM)poll=setInterval(refreshMsgs,3500)}catch(e){$("m").innerHTML=`<div class="note s">Error: ${esc(e.message||e)}</div>`}}

/* Vista Descubrir con filtro de País */
async function disc(){
 let query = sb.from("profiles").select("*").neq("id",U.id);
 if(filterCountry!=="GLOBAL") query = query.eq("country",filterCountry);
 const[{data:ps,error:e1},{data:ls}]=await Promise.all([query.limit(40),sb.from("likes").select("to_user").eq("from_user",U.id)]);
 if(e1)throw e1;const seen=new Set([...(ls||[]).map(x=>x.to_user),...passes()]);const q=(ps||[]).filter(p=>!seen.has(p.id));pend=q;const p=q[0];
 
 const filterHtml = `<div class="s" style="margin-bottom:12px"><label>${t("filter")}</label><select onchange="filterCountry=this.value;draw()">${COUNTRIES.map(c=>`<option value="${c.c}" ${filterCountry===c.c?"selected":""}>${c.n}</option>`).join("")}</select></div>`;
 if(!p)return `<h2>${t("disc")}</h2>${filterHtml}<div class="card s"><h3>No hay perfiles</h3><p class="mu">Prueba seleccionando otro país en el selector superior.</p></div>`;
 await urls([p]);const sc=score(p);const pFrame=getFrameCls(p.active_frame);
 return `<h2>${t("disc")}</h2>${filterHtml}<div class="card s"><div class="av ${pFrame}">${pic(p)}</div>
 <span class="badge ${p.verified?"v":""}">${p.verified?"Verificado":"Sin verificar"}</span> · <span class="badge">${p.country||"🌐"}</span>
 <h2 style="margin-top:8px">${esc(p.name)}${ageTxt(p)}</h2><p class="mu">${esc(p.bio)}</p><p class="mu">Busca: ${esc(p.goal)}</p>${tags(p.interests,ME.interests)}
 <p style="font-size:14px;margin:10px 0 0">Compatibilidad: <b>${sc}%</b></p><div class="bar"><i style="width:${sc}%"></i></div></div>
 <div class="row act s"><button onclick="pass('${p.id}')">✕</button><button onclick="like('${p.id}',true)" style="color:#2d8cff">★</button><button onclick="like('${p.id}',false)" style="color:var(--co)">♥</button></div>`}

function pass(id){addPass(id);draw()}
async function like(id,sup){const{error}=await sb.from("likes").insert({from_user:U.id,to_user:id,is_super:sup});if(error)return err(error);draw()}

/* Vista Tienda de Diamantes */
async function shop(){
 return `<h2>${t("shop")}</h2>
 <div class="card s"><div class="row" style="align-items:center"><div><b>Tus Diamantes:</b><div class="mu">Gana +1 diamante por cada mensaje que envíes en el chat.</div></div><div class="dia-badge" style="font-size:18px">💎 ${ME.diamonds||0}</div></div></div>
 <div class="card s"><h3>Personalizaciones</h3>
 ${SHOP_ITEMS.map(it=>{
   const bought = (ME.unlocked_items||[]).includes(it.id);
   const active = ME.active_frame === it.id;
   return `<div class="item-card">
     <div><b>${it.name}</b><br><small class="mu">${it.type==='frame'?'Marco para foto':'Pack para chat'}</small></div>
     <div>
       ${bought 
         ? (it.type==='frame' ? `<button onclick="setFrame('${active?'none':it.id}')" style="padding:6px 12px;font-size:13px">${active?'Quitar':'Usar'}</button>` : `<span class="badge v">Desbloqueado</span>`)
         : `<button class="p" onclick="buyItem('${it.id}',${it.cost})" style="padding:6px 12px;font-size:13px">💎 ${it.cost}</button>`}
     </div>
   </div>`
 }).join("")}
 </div>`;
}

async function buyItem(id,cost){
 if((ME.diamonds||0) < cost) return alert("No tienes suficientes diamantes. ¡Chatea para ganar más!");
 const newDia = ME.diamonds - cost;
 const newItems = [...(ME.unlocked_items||[]), id];
 const{error}=await sb.from("profiles").update({diamonds:newDia, unlocked_items:newItems}).eq("id",U.id);
 if(error) return err(error);
 ME.diamonds = newDia; ME.unlocked_items = newItems;
 alert("¡Artículo desbloqueado!"); draw();
}

async function setFrame(id){
 const{error}=await sb.from("profiles").update({active_frame:id}).eq("id",U.id);
 if(error) return err(error);
 ME.active_frame = id; draw();
}

/* Likes & Matches */
async function likes(){
 const{data}=await sb.from("likes").select("to_user,is_super").eq("from_user",U.id).order("created_at",{ascending:false});
 const ids=(data||[]).map(x=>x.to_user);if(!ids.length)return `<h2>${t("likes")}</h2><p class="mu s">Aún no diste likes.</p>`;
 const{data:ps}=await sb.from("profiles").select("id,name,birth_date,hide_age,photo_path,active_frame").in("id",ids);await urls(ps||[]);const m=Object.fromEntries((ps||[]).map(p=>[p.id,p]));
 return `<h2>${t("likes")}</h2>`+(data||[]).filter(x=>m[x.to_user]).map(x=>`<div class="card li s"><div class="mini ${getFrameCls(m[x.to_user].active_frame)}">${pic(m[x.to_user])}</div><div><b>${esc(m[x.to_user].name)}${ageTxt(m[x.to_user])}</b> ${x.is_super?"★":""}</div></div>`).join("");
}

async function myMatches(){
 const{data}=await sb.from("matches").select("*").order("created_at",{ascending:false});
 const o=(data||[]).map(m=>({id:m.id,o:m.user_a===U.id?m.user_b:m.user_a}));
 if(!o.length)return[];const{data:ps}=await sb.from("profiles").select("*").in("id",o.map(x=>x.o));await urls(ps||[]);const pm=Object.fromEntries((ps||[]).map(p=>[p.id,p]));
 return o.filter(x=>pm[x.o]).map(x=>({id:x.id,p:pm[x.o]}));
}

async function matches(){
 const l=await myMatches();
 return `<h2>${t("matches")}</h2>`+(l.length?l.map(x=>`<div class="card li s" onclick="tab='c';chatM=${x.id};draw()"><div class="mini ${getFrameCls(x.p.active_frame)}">${pic(x.p)}</div><div><b>${esc(x.p.name)}${ageTxt(x.p)}</b><div class="mu">${score(x.p)}% afinidad</div></div></div>`).join(""):`<p class="mu s">Sin matches aún.</p>`);
}

/* Chat con economía de Diamantes */
function getUnlockedEmojis(){
  let list = ["😊","❤️","👍","🔥"];
  if(ME.unlocked_items?.includes("pack_love")) list.push("💐","💌","💍","🥰");
  if(ME.unlocked_items?.includes("pack_party")) list.push("🥂","🚀","💎","✨");
  return list;
}

async function chat(){
 if(chatM){
  const l=await myMatches(),x=l.find(y=>y.id===chatM);if(!x){chatM=null;return chat()}
  const emBtns = getUnlockedEmojis().map(e=>`<button type="button" style="padding:4px 8px;font-size:16px;border-radius:8px" onclick="$('mi').value+='${e}'">${e}</button>`).join(" ");
  return `<button class="s" onclick="chatM=null;draw()">← Matches</button><h3 style="margin-top:8px">${esc(x.p.name)}</h3>
  <div id="ms" class="s" style="max-height:360px;overflow-y:auto;margin-bottom:8px"></div>
  <div class="s" style="display:flex;gap:4px;overflow-x:auto;padding-bottom:6px">${emBtns}</div>
  <div class="row s"><input id="mi" placeholder="Escribe..." maxlength="1000" style="margin:0"><button class="p" onclick="send()" style="flex:none">Enviar (+1💎)</button></div>`+`<img src="data:," style="display:none" onerror="refreshMsgs()">`;
 }
 const l=await myMatches();
 return `<h2>${t("chat")}</h2>`+(l.length?l.map(x=>`<div class="card li s" onclick="chatM=${x.id};draw()"><div class="mini ${getFrameCls(x.p.active_frame)}">${pic(x.p)}</div><b>${esc(x.p.name)}</b></div>`).join(""):`<p class="mu s">Haz match para chatear.</p>`);
}

async function refreshMsgs(){const el=$("ms");if(!el||!chatM)return;const{data}=await sb.from("messages").select("*").eq("match_id",chatM).order("created_at");
 el.innerHTML=(data||[]).map(x=>`<div class="msg ${x.sender===U.id?"me":"ot"}">${esc(x.body)}<small>${new Date(x.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</small></div>`).join("");el.scrollTop=el.scrollHeight}

async function send(){
 const v=$("mi").value.trim();if(!v)return;
 const{error}=await sb.from("messages").insert({match_id:chatM,sender:U.id,body:v});
 if(error)return err(error);
 $("mi").value="";
 // Recompensa de 1 diamante por mensaje enviado
 const newD = (ME.diamonds||0) + 1;
 ME.diamonds = newD;
 await sb.from("profiles").update({diamonds:newD}).eq("id",U.id);
 refreshMsgs();
}

/* Vista Perfil */
async function prof(){
 await urls([ME]);
 const myFrame = getFrameCls(ME.active_frame);
 return `<h2>${t("prof")}</h2>
 <div class="card s">
   <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
     <div class="dia-badge">💎 ${ME.diamonds||0} diamantes</div>
     <div>
       <select onchange="lang=this.value;localStorage.setItem('tm_lang',this.value);draw()" style="width:auto;margin:0;padding:4px 8px;font-size:12px">
         <option value="es" ${lang==='es'?'selected':''}>Español</option>
         <option value="en" ${lang==='en'?'selected':''}>English</option>
         <option value="pt" ${lang==='pt'?'selected':''}>Português</option>
         <option value="fr" ${lang==='fr'?'selected':''}>Français</option>
       </select>
     </div>
   </div>
   <div class="av ${myFrame}">${pic(ME)}</div>
   <input type="file" accept="image/*" onchange="upPhoto(this)">
   <b>${esc(ME.name)}${ageTxt(ME)}</b> <span class="badge">${ME.country||"ES"}</span>
   <p class="mu">${esc(ME.bio)||"Sin biografía"}</p>
 </div>
 <div class="card s">
   <button onclick="sb.auth.signOut()" style="width:100%">Cerrar sesión</button>
 </div>`;
}

async function upPhoto(inp){const f=inp.files[0];if(!f)return;
 try{const bm=await createImageBitmap(f);const k=Math.min(1,720/Math.max(bm.width,bm.height));const c=document.createElement("canvas");c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
 const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.85));const path=U.id+"/main.jpg";
 const{error}=await sb.storage.from("avatars").upload(path,blob,{upsert:true,contentType:"image/jpeg"});if(error)return err(error);
 await sb.from("profiles").update({photo_path:path}).eq("id",U.id);ME.photo_path=path;delete C[path];draw()}catch(e){err(e)}}
</script>
