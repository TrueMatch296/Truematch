t:`<h2>Términos de uso</h2>${NOTA}
<h3>1. Qué es TrueMatch</h3><p>TrueMatch es un servicio para conocer personas con intereses y objetivos afines. Hoy es gratuito. Al crear una cuenta aceptas estos Términos, la Política de Privacidad y las Normas de la comunidad.</p>
<h3>2. Edad mínima</h3><p>Solo pueden usar TrueMatch personas de 18 años o más. Si detectamos una cuenta de una persona menor de edad, la eliminamos. Si conoces un caso, repórtalo.</p>
<h3>3. Tu cuenta</h3><p>Debes dar datos verdaderos, tener una sola cuenta, no hacerte pasar por otra persona y cuidar tu contraseña. Para ver a otras personas, dar Me gusta y chatear debes verificar tu identidad con una selfie, que revisa una persona; podemos rechazar o retirar la verificación si hay dudas. La verificación reduce el riesgo de perfiles falsos pero no lo elimina.</p>
<h3>4. Conducta y moderación</h3><p>Debes cumplir las Normas de la comunidad. Los reportes se revisan manualmente. Podemos retirar contenido y suspender o eliminar cuentas que incumplan las normas o la ley.</p>
<h3>5. Tu contenido</h3><p>Tus fotos y textos siguen siendo tuyos. Nos autorizas a mostrarlos a otros usuarios dentro del servicio mientras tu cuenta exista. No subas fotos de otras personas sin su permiso ni contenido ilegal.</p>
<h3>6. Seguridad personal</h3><p>No podemos comprobar quién es cada persona: la insignia de verificado solo aparece si un administrador la otorga manualmente. La compatibilidad es una estimación, no una garantía. Si te reúnes con alguien, hazlo en un lugar público y avisa a alguien de confianza.</p>
<h3>7. Costos, diamantes y publicidad</h3><p>El servicio es gratuito. Los diamantes (💎) son puntos virtuales del juego dentro de la app: se ganan chateando, se usan para stickers y marcos, no se compran con dinero, no se pueden cambiar por dinero y no tienen valor fuera de TrueMatch. Si en el futuro hubiera cobros, anuncios o patrocinios, se avisará con claridad y anticipación, y no se cobrará nada sin tu consentimiento.</p>
<h3>8. Borrar tu cuenta</h3><p>Puedes borrar tu cuenta y tus datos cuando quieras desde Perfil.</p>
<h3>9. Responsabilidad</h3><p>El servicio se ofrece "tal cual" y puede tener interrupciones. En la medida permitida por la ley, TrueMatch no responde por la conducta de otros usuarios. Esto no limita derechos que la ley de tu país no permita renunciar.</p>
<h3>10. Ley aplicable y contacto</h3><p>Se aplican las leyes de la República Bolivariana de Venezuela, sin perjuicio de las normas obligatorias de protección al consumidor o de datos de tu país de residencia. Contacto: ${CONTACTO}.</p>
<h3>11. Cambios</h3><p>Si cambiamos estos términos de forma importante, te avisaremos en la app.</p>`,
p:`<h2>Política de privacidad</h2>${NOTA}
<h3>Responsable</h3><p>TrueMatch. Contacto para privacidad: ${CONTACTO}.</p>
<h3>Datos que guardamos</h3><p>Correo y contraseña (la contraseña la protege el proveedor de autenticación; nosotros no la vemos); nombre, fecha de nacimiento, país (el que tú eliges), biografía, intereses, objetivo y fotos de perfil (hasta 6; se les quitan los datos de ubicación del archivo); si tú lo activas, una ubicación aproximada (redondeada a unos 1 km); tus Me gusta, matches, mensajes, bloqueos y reportes; la fecha en que aceptaste los términos; las notas de voz que envías en un chat; y, solo durante la verificación, una selfie con un código (la revisa una persona y se borra al terminar la revisión) junto con el resultado de la revisión. El proveedor puede registrar datos técnicos (como la dirección IP) por seguridad.</p>
<h3>Datos que NO recolectamos</h3><p>Tu ubicación exacta (solo si activas «Personas cerca» guardamos una ubicación aproximada de unos 1 km; nunca se muestra a otros, solo una distancia aproximada, y puedes borrarla cuando quieras en Perfil), contactos del teléfono ni documentos de identidad. No usamos reconocimiento facial automático ni guardamos plantillas biométricas: la selfie de verificación la compara una persona con tus fotos de perfil y luego se borra. El país de tu perfil es un dato que tú declaras y puedes cambiar cuando quieras.</p>
<h3>Para qué los usamos</h3><p>Para operar el servicio, mostrar perfiles, crear matches, permitir chats, calcular una compatibilidad estimada con una fórmula simple (sin inteligencia artificial externa) y mantener la seguridad y la moderación.</p>
<h3>Quién ve qué</h3><p>Otros usuarios registrados ven tu nombre, edad (si no la ocultas), país, biografía, intereses, objetivo, fotos y, si activaste tu ubicación, la distancia aproximada que hay entre ustedes (nunca tus coordenadas). Tu correo nunca se muestra. Tus mensajes y notas de voz solo los ve la otra persona del chat. Tu selfie de verificación solo la ve quien modera TrueMatch. Los mensajes no están cifrados de extremo a extremo: el administrador del servicio puede acceder técnicamente a los datos para moderación y soporte. No vendemos tus datos ni los compartimos con anunciantes.</p>
<h3>Proveedores</h3><p>Usamos Supabase (base de datos, autenticación y almacenamiento de fotos) y GitHub Pages (alojamiento de la página). Tus datos pueden procesarse en servidores fuera de tu país.</p>
<h3>Cuánto tiempo los conservamos</h3><p>Mientras tu cuenta exista. Si la borras desde Perfil, se eliminan tu cuenta de acceso, perfil, foto, Me gusta, matches, mensajes y registros asociados. Las copias de seguridad del proveedor, si existen, se sobrescriben con el tiempo.</p>
<h3>Tus derechos</h3><p>Puedes pedir acceso, corrección, eliminación, oposición o una copia de tus datos escribiendo a ${CONTACTO}; responderemos en un plazo razonable (objetivo: 30 días). La eliminación también puedes hacerla tú mismo en Perfil. Esto está pensado para respetar el artículo 28 de la Constitución de Venezuela (acceso, rectificación y supresión de datos) y normas como el RGPD europeo, la ley de California, la LGPD de Brasil y otras leyes de tu país.</p>
<h3>Menores</h3><p>TrueMatch es solo para mayores de 18 años y no recolecta datos de menores a sabiendas.</p>
<h3>Seguridad</h3><p>Usamos conexión cifrada (HTTPS) y reglas de acceso que limitan qué datos puede leer cada persona. Ningún sistema es 100% seguro. Si ocurriera una brecha que te afecte, te avisaremos como lo exija la ley.</p>
<h3>Cookies y almacenamiento local</h3><p>Usamos el almacenamiento del navegador solo para mantener tu sesión y recordar los perfiles que pasaste. No usamos cookies de publicidad ni rastreadores de terceros.</p>`,
n:`<h2>Normas de la comunidad</h2>${NOTA}
<p>TrueMatch es para conocer personas reales con respeto. Está prohibido:</p>
<p>• Ser menor de 18 años o interactuar de forma sexual con menores.<br>• Perfiles falsos, suplantación de identidad o fotos de otras personas.<br>• Acoso, amenazas, discurso de odio o discriminación.<br>• Desnudos, contenido sexual explícito o violento.<br>• Estafas, pedir dinero, vender cosas, publicidad o spam.<br>• Compartir datos privados de otras personas.<br>• Cualquier actividad ilegal.</p>
<h3>Qué hacemos si se incumplen</h3><p>Podemos retirar contenido, suspender o eliminar cuentas y, cuando la ley lo exija, avisar a las autoridades.</p>
<h3>Cómo protegerte</h3><p>Usa <b>Reportar</b> y <b>Bloquear</b> en cualquier perfil o chat. No envíes dinero ni datos bancarios. Reúnete en lugares públicos y avisa a alguien de confianza.</p>`,
i:`<h2>Seguridad infantil</h2>${NOTA}
<p>TrueMatch tiene tolerancia cero con el abuso y la explotación sexual infantil. Solo se permite el uso a personas de 18 años o más.</p>
<p>• Puedes reportar cualquier perfil o mensaje desde la app con el botón Reportar.<br>• Si recibimos un reporte de este tipo, retiramos el contenido, cerramos la cuenta y, cuando corresponda, lo informamos a las autoridades competentes.<br>• Persona de contacto para temas de seguridad infantil: ${CONTACTO}.</p>
<p>Si sabes de un menor en peligro, avisa también a las autoridades de tu país o a la línea de ayuda local.</p>`};

async function like(id,sup){const{error}=await sb.from("likes").insert({from_user:U.id,to_user:id,is_super:sup});if(error){err(error);return draw()}
 const a=[U.id,id].sort();const{data}=await sb.from("matches").select("id").eq("user_a",a[0]).eq("user_b",a[1]);if(data&&data.length)alert(t("m_match"));draw()}
async function rep(id){const r=prompt(t("m_rep"));if(!r)return;const{error}=await sb.from("reports").insert({reporter:U.id,reported:id,reason:r.slice(0,500)});error?err(error):alert(t("m_repok"))}
async function blk(id){if(!confirm(t("m_blk")))return;const{error}=await sb.from("blocks").insert({blocker:U.id,blocked:id});error?err(error):draw()}
async function likes(){const{data}=await sb.from("likes").select("to_user,is_super").eq("from_user",U.id).order("created_at",{ascending:false});
 const ids=(data||[]).map(x=>x.to_user);if(!ids.length)return `<h2>${t("nl")}</h2><p class="mu">${t("nolk")}</p>`;
 const{data:ps}=await sb.from("profiles").select("id,name,birth_date,hide_age,photo_path,country,frame").in("id",ids);await urls(ps||[]);const m=Object.fromEntries((ps||[]).map(p=>[p.id,p]));
 return `<h2>${t("nl")}</h2>`+(data||[]).filter(x=>m[x.to_user]).map(x=>{const p=m[x.to_user];return `<div class="card li"><div class="mini${frc(p)}">${pic(p)}</div><div><b>${esc(p.name)}${ageTxt(p)}</b> ${x.is_super?"★":""}<div class="mu">${flag(p.country)} ${t("sent")}</div></div></div>`}).join("")}
async function myMatches(){const{data}=await sb.from("matches").select("*").order("created_at",{ascending:false});const o=(data||[]).map(m=>({id:m.id,o:m.user_a===U.id?m.user_b:m.user_a}));
 if(!o.length)return[];const{data:ps}=await sb.from("profiles").select("*").in("id",o.map(x=>x.o));await urls(ps||[]);const pm=Object.fromEntries((ps||[]).map(p=>[p.id,p]));return o.filter(x=>pm[x.o]).map(x=>({id:x.id,p:pm[x.o]}))}
async function matches(){const l=await myMatches();return `<h2>${t("nm")}</h2><p class="mu">${t("mint")}</p>`+(l.length?l.map(x=>`<div class="card li" onclick="tab='c';chatM=${x.id};draw()"><div class="mini${frc(x.p)}">${pic(x.p)}</div><div><b>${esc(x.p.name)}${ageTxt(x.p)}</b><div class="mu">${flag(x.p.country)} ${score(x.p)}% ${t("comp2")}</div></div></div>`).join(""):`<p class="mu">${t("nom")}</p>`)}
async function chat(){
 if(chatM){const l=await myMatches(),x=l.find(y=>y.id===chatM);if(!x){chatM=null;return chat()}await loadShop();
  return `<button onclick="chatM=null;draw()">${t("back")}</button><div class="top" style="margin-top:10px"><h3 style="margin:0">${flag(x.p.country)} ${esc(x.p.name)}</h3><span class="pill dm" id="wal">💎 ${WAL}</span></div><div class="row" style="margin:8px 0"><button onclick="rep('${x.p.id}')">${t("rep")}</button><button onclick="blk('${x.p.id}')">${t("blk")}</button></div>
  <div class="note">${t("cnt")}</div><div id="ms"></div><div class="card" id="vrec" style="display:none;margin-top:10px"><div class="rec"><i></i><b>${t("vn_rec")}</b><span id="vt">0:00</span><span style="flex:1"></span><button onclick="vStop(false)">${t("cx")}</button><button class="p" onclick="vStop(true)">${t("snd")}</button></div></div><div class="row" id="vbar" style="margin-top:10px"><input id="mi" placeholder="${t("wr")}" maxlength="2000" style="margin:0;flex:3"><button onclick="vStart()" style="flex:none;padding:12px" aria-label="mic">🎤</button><button onclick="tsp()" style="flex:none;padding:12px">😊</button><button class="p" onclick="send()" style="flex:none">${t("snd")}</button></div><div class="card" id="stp" style="display:none;margin-top:8px">${stPanel()}</div><img src="data:," style="display:none" onerror="refreshMsgs()">`}
 const l=await myMatches();return `<h2>${t("nc")}</h2>`+(l.length?l.map(x=>`<div class="card li" onclick="chatM=${x.id};draw()"><div class="mini${frc(x.p)}">${pic(x.p)}</div><b>${esc(x.p.name)}</b></div>`).join(""):`<p class="mu">${t("nochat")}</p>`)}
async function refreshMsgs(){const el=$("ms");if(!el||!chatM)return;const{data,error}=await sb.from("messages").select("*").eq("match_id",chatM).order("created_at");if(error)return;
 const sg=(data||[]).map(x=>x.id).join(",");if(el.dataset.s===sg)return;el.dataset.s=sg;
 el.innerHTML=(data||[]).map(x=>`<div class="msg ${x.sender===U.id?"me":"ot"}${stk(x.body)?" stk":""}">${vnp(x.body)?`<audio controls preload="none" data-vn="${vnp(x.body)}" style="width:220px;max-width:100%;height:38px"></audio>`:(stk(x.body)||esc(x.body))}<small>${new Date(x.created_at).toLocaleString(LANG)}</small></div>`).join("");hydrateVn()}
const stk=b=>{const m=/^\{\{st:([a-z_]+):(\d{1,2})\}\}$/.exec(b);return m&&PK[m[1]]&&PK[m[1]].e[+m[2]]?`<span style="font-size:44px;line-height:1.1">${PK[m[1]].e[+m[2]]}</span>`:""};
const stPanel=()=>{const o=Object.keys(PK).filter(id=>OWN.has(id));if(!o.length)return `<p class="mu" style="margin:0">${t("st_none")}</p>`;const li=L.indexOf(LANG);
 return o.map(id=>`<div class="pk">${PK[id].n[li]}</div><div class="stp">${PK[id].e.map((e,i)=>`<button onclick="sendSt('${id}',${i})">${e}</button>`).join("")}</div>`).join("")};
function tsp(){const e=$("stp");if(e)e.style.display=e.style.display==="none"?"block":"none"}
async function sendSt(id,i){const{error}=await sb.from("messages").insert({match_id:chatM,sender:U.id,body:`{{st:${id}:${i}}}`});if(error)return alert(shopErr(error));tsp();refreshMsgs()}
async function send(){const v=$("mi").value.trim();if(!v)return;const{error}=await sb.from("messages").insert({match_id:chatM,sender:U.id,body:v});if(error)return alert(shopErr(error));$("mi").value="";refreshMsgs();updWal()}
async function prof(){delete GAL[ME.id];await gal([ME]);await urls([ME]);try{await loadShop()}catch(e){}if(LOC===undefined)await loadLoc();if(ADM===undefined){try{const{data}=await sb.rpc("is_admin");ADM=!!data}catch(e){ADM=false}}const ph=GAL[ME.id]||[];
 const g=ph.map((x,i)=>`<div class="gi"><img src="${C[x]||""}" alt="">${i===0?`<span class="cv">${t("cover")}</span>`:`<button class="st" onclick="mkCover(${i})">★</button>`}<button class="x" onclick="delPhoto(${i})">✕</button></div>`).join("")+(ph.length<6?`<label class="gi add">+<input type="file" accept="image/*" style="display:none" onchange="upPhoto(this)"></label>`:"");
 return `<div class="top"><h2 style="margin:0">${t("np")}</h2><div style="display:flex;gap:6px;align-items:center">${themeBtn()}${langSel()}</div></div><div class="card"><div class="li" style="cursor:default;margin-bottom:10px"><div class="mini${frc(ME)}">${pic(ME)}</div><span class="pill dm" style="margin:0" onclick="tab='s';draw()">💎 ${WAL}</span></div><label style="display:block;margin-bottom:6px">${t("gal")}</label><div class="gg">${g}</div><p class="mu" style="font-size:12px">${t("photo")}</p>
<b>${esc(ME.name)}, ${age(ME.birth_date)}</b> <span class="badge ${ME.verified?"v":""}">${ME.verified?t("ver"):t("unv")}</span><p class="mu">${esc(ME.bio)}</p><p class="mu">${t("goal")}: ${esc(tg(ME.goal))}</p>${tags(ME.interests)}<button style="width:100%;margin-top:10px" onclick="editView()">${t("ed")}</button>
<label style="display:block;margin-top:10px">${t("ctry")}</label><select onchange="setCountry(this.value)"><option value="">${t("pick")}</option>${copts(ME.country||"")}</select>
<label style="display:block"><input type="checkbox" style="width:auto;margin-right:8px" ${ME.hide_age?"checked":""} onchange="hideAge(this.checked)">${t("hide")}</label><p class="mu" style="font-size:12px">${t("vnote")}</p></div>
<div class="card"><h3>${t("locttl")}</h3><p class="mu" style="font-size:13px">${LOC?t("locok"):t("locno")}</p><div class="row"><button class="p" onclick="setLoc()">${LOC?t("locup"):t("locon")}</button>${LOC?`<button onclick="delLoc()">${t("locdel")}</button>`:""}</div></div>
<div class="card" id="thseg"><label style="display:block;margin-bottom:6px">${t("th")}</label><div class="row">${["auto","light","dark"].map(v=>`<button class="${TH===v?"p":""}" onclick="setTheme('${v}')">${t("th_"+v[0])}</button>`).join("")}</div></div>
<div class="card"><h3>${t("v_title")}</h3>${ME.verified?`<span class="badge v">${t("ver")}</span><p class="mu">${t("v_ok")}</p>`:`<p class="mu">${t("v_why")}</p><button class="p" style="width:100%" onclick="verifView()">${t("v_start")}</button>`}</div>${ADM?`<div class="card"><h3>${t("adm_t")}</h3><button style="width:100%" onclick="adminView()">${t("adm_open")}</button></div>`:""}
<div class="card"><h3>${t("legal")}</h3><p><a href="#" onclick="return lg('t')">${t("lt")}</a><br><a href="#" onclick="return lg('p')">${t("lp")}</a><br><a href="#" onclick="return lg('n')">${t("ln")}</a><br><a href="#" onclick="return lg('i')">${t("li")}</a></p><p class="mu" style="font-size:12px">${CONTACTO}</p></div>
<div class="card"><button onclick="sb.auth.signOut()">${t("out")}</button> <button style="margin-top:8px;color:#d33" onclick="del()">${t("del")}</button></div>`}
function editView(){$("m").className="";$("nv").style.display="none";$("m").innerHTML=head()+`<div class="card"><h3>${t("ed")}</h3><label>${t("name")}</label><input id="n" maxlength="40" value="${esc(ME.name)}">
<label>${t("bio")}</label><textarea id="bio" rows="3" maxlength="300">${esc(ME.bio)}</textarea><label>${t("goal")}</label><select id="g">${GOALS.map(g=>`<option value="${g}" ${ME.goal===g?"selected":""}>${tg(g)}</option>`).join("")}</select>
<label>${t("ints")}</label><div id="ints">${INT.map(x=>`<span class="tag ${(ME.interests||[]).includes(x)?"on":""}" data-v="${x}" onclick="this.classList.toggle('on')">${ti(x)}</span>`).join("")}</div>
<div class="row" style="margin-top:12px"><button onclick="draw()">${t("cx")}</button><button class="p" onclick="saveEdit()">${t("sv")}</button></div></div>`}
async function saveEdit(){const n=$("n").value.trim();if(!n)return alert(t("e_fill"));const i=[...document.querySelectorAll("#ints .on")].map(e=>e.dataset.v);if(!i.length)return alert(t("e_int"));
 const{data,error}=await sb.from("profiles").update({name:n,bio:$("bio").value,goal:$("g").value,interests:i}).eq("id",U.id).select().single();if(error)return err(error);ME=data;alert(t("saved"));draw()}
async function setCountry(v){if(!v)return;const{error}=await sb.from("profiles").update({country:v}).eq("id",U.id);error?err(error):(ME.country=v)}
async function setCover(p){const{error}=await sb.from("profiles").update({photo_path:p}).eq("id",U.id);if(error)return err(error);ME.photo_path=p}
async function savePos(a){for(let k=0;k<a.length;k++)await sb.from("profile_photos").update({position:k}).eq("user_id",U.id).eq("path",a[k])}
async function upPhoto(inp){const f=inp.files[0];if(!f||!f.type.startsWith("image/"))return;const ph=GAL[ME.id]||[];if(ph.length>=6)return alert(t("e_photos"));
 try{const bm=await createImageBitmap(f);const k=Math.min(1,720/Math.max(bm.width,bm.height));const c=document.createElement("canvas");c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
 const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.85));const path=U.id+"/"+Date.now()+".jpg";
 const{error}=await sb.storage.from("avatars").upload(path,blob,{contentType:"image/jpeg"});if(error)return err(error);
 const{error:e2}=await sb.from("profile_photos").insert({user_id:U.id,path,position:ph.length});if(e2){await sb.storage.from("avatars").remove([path]);return err(e2)}
 if(!ph.length)await setCover(path);draw()}catch(e){err(e)}}
async function mkCover(i){const ph=GAL[ME.id]||[];if(!ph[i])return;const a=[ph[i],...ph.filter((_,j)=>j!==i)];await savePos(a);await setCover(a[0]);draw()}
async function delPhoto(i){const ph=GAL[ME.id]||[];if(!ph[i]||!confirm(t("delph")))return;const p=ph[i];
 try{await sb.storage.from("avatars").remove([p])}catch(e){}
 const{error}=await sb.from("profile_photos").delete().eq("user_id",U.id).eq("path",p);if(error)return err(error);
 const rest=ph.filter((_,j)=>j!==i);await savePos(rest);await setCover(rest[0]||null);draw()}
async function hideAge(v){const{error}=await sb.from("profiles").update({hide_age:v}).eq("id",U.id);error?err(error):ME.hide_age=v}
async function del(){if(!confirm(t("m_del")))return;try{const{data:fl}=await sb.storage.from("avatars").list(U.id,{limit:100});if(fl&&fl.length)await sb.storage.from("avatars").remove(fl.map(x=>U.id+"/"+x.name))}catch(e){}
 try{await sb.storage.from("verification").remove([U.id+"/selfie.jpg"])}catch(e){}
 try{const{data:ms}=await sb.from("matches").select("id");for(const m of ms||[]){const{data:fs}=await sb.storage.from("voice").list(String(m.id),{limit:1000});const mine=(fs||[]).filter(f=>f.name.startsWith(U.id+"-")).map(f=>m.id+"/"+f.name);if(mine.length)await sb.storage.from("voice").remove(mine)}}catch(e){}
 const{error}=await sb.rpc("delete_my_account");if(error)return err(error);alert(t("m_delok"));await sb.auth.signOut()}
document.documentElement.lang=LANG;
</script></body></html>
